name: Set Cloudflare workers.dev subdomain (one-time maintenance)

on:
  workflow_dispatch:
    inputs:
      subdomain:
        description: 'New account-wide workers.dev subdomain'
        required: true
        default: 'dustin-hebecker'

permissions:
  contents: read

jobs:
  rename:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rename subdomain via Cloudflare API
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SUBDOMAIN: ${{ inputs.subdomain }}
        run: |
          api() { curl -sS -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" "$@"; }
          if [ -z "$CF_ACCOUNT" ]; then
            CF_ACCOUNT=$(api https://api.cloudflare.com/client/v4/accounts | jq -r '.result[0].id')
          fi
          echo "Current:"; api "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" | jq '{success, subdomain: .result.subdomain, errors}'
          echo "Update:"; api -X PUT "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT/workers/subdomain" \
            --data "$(jq -n --arg s "$SUBDOMAIN" '{subdomain: $s}')" | tee result.json | jq '{success, subdomain: .result.subdomain, errors}'
          jq -e '.success' result.json > /dev/null
