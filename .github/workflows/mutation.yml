name: Mutation tests

# Targeted mutation testing (Stryker) on high-value logic: RNG, persistence, deck model,
# localization core, and each game's rules/AI. Not run on presentation code.
on:
  pull_request:
    paths:
      - 'packages/**/src/**'
      - 'stryker.config.json'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mutation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 14
