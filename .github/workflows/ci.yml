name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Lint, types, unit & property tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:licenses
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm coverage
      - name: Development build (no legal data; must still succeed)
        run: pnpm build
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  puzzles:
    name: Chess puzzles (full re-verification)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm vitest run packages/games/chess/test/puzzle-data.test.ts
        env:
          CHESS_VERIFY_PUZZLES: '1'

  e2e:
    name: E2E (Playwright, desktop + mobile, offline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare
    needs: [quality, puzzles, e2e]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check deployment configuration
        id: config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::Cloudflare secrets are not configured; skipping deployment (see docs/deployment.md)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.config.outputs.enabled == 'true'
      - uses: pnpm/action-setup@v6
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v7
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: pnpm
      - if: steps.config.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile
      - name: Release build with legal notice (values come from secrets, never logged)
        if: steps.config.outputs.enabled == 'true'
        env:
          WP_LEGAL: ${{ secrets.WP_LEGAL }}
          WP_LEGAL_NAME: ${{ secrets.WP_LEGAL_NAME }}
          WP_LEGAL_ADDRESS: ${{ secrets.WP_LEGAL_ADDRESS }}
          WP_LEGAL_EMAIL: ${{ secrets.WP_LEGAL_EMAIL }}
        run: |
          node scripts/check-release-env.mjs
          pnpm build
      - name: Deploy (Cloudflare Pages)
        id: deploy
        if: steps.config.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The account ID is optional: with a token limited to one account, wrangler detects it.
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then unset CLOUDFLARE_ACCOUNT_ID; fi
          set -o pipefail
          # Create the Pages project on first deploy (no-op afterwards).
          if ! pnpm exec wrangler pages project list 2>/dev/null | grep -q 'worthwhile-play'; then
            pnpm exec wrangler pages project create worthwhile-play --production-branch main
          fi
          pnpm exec wrangler pages deploy --branch main --commit-dirty=true 2>&1 | tee deploy.log
          echo "url=$(pnpm exec wrangler pages project list 2>/dev/null | grep -oE 'worthwhile-play[a-z0-9-]*\.pages\.dev' | head -1 | sed 's#^#https://#')" >> "$GITHUB_OUTPUT"
