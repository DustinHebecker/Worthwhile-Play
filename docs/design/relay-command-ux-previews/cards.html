<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Unit card proposals</title>
    <style>
      :root {
        --bg: #f6f4ef;
        --surface: #ffffff;
        --surface-2: #ecebe5;
        --text: #1d1d1b;
        --muted: #5c5b55;
        --border: #cfcdc4;
        --focus: #b4530a;
        --danger: #a1271b;
        --p1: #24508f;
        --p2: #9a3412;
        --ok: #26643a;
        --font:
          system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans",
          "Noto Sans Arabic", sans-serif;
      }
      body {
        margin: 0;
        background: #d9d6cc;
        font-family: var(--font);
        color: var(--text);
        line-height: 1.45;
      }
      #page {
        display: grid;
        gap: 18px;
        padding: 18px;
        width: max-content;
      }
      .row {
        display: flex;
        gap: 18px;
        align-items: flex-start;
      }
      .col {
        background: var(--bg);
        border-radius: 14px;
        padding: 12px 16px 16px;
        box-sizing: border-box;
      }
      .col h2 {
        font-size: 15px;
        margin: 0 0 2px;
      }
      .col .why {
        font-size: 12px;
        color: var(--muted);
        margin: 0 0 10px;
        min-height: 3.2em;
      }
      .col img {
        display: block;
        border-radius: 10px;
      }
      .rowtitle {
        font-size: 18px;
        font-weight: 700;
        margin: 4px 0 -6px 4px;
      }

      /* ---------- Shared card bits (logical properties only: RTL-safe) ---------- */
      .card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface-2);
        padding: 10px;
        display: grid;
        gap: 10px;
      }
      .head {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .head .ic {
        flex: none;
        inline-size: 52px;
        block-size: 52px;
        border-radius: 8px;
        background: #e7e3d4;
      }
      .who {
        display: grid;
        gap: 3px;
        min-inline-size: 0;
      }
      .name {
        font-weight: 700;
        font-size: 1.06rem;
        margin: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .chip {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        padding: 1px 8px 1px 6px;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--surface);
        font-size: 0.82rem;
        white-space: nowrap;
      }
      .chip svg {
        flex: none;
      }
      .chip.side {
        border-color: var(--p1);
        color: var(--p1);
        font-weight: 600;
      }
      .chip.warn {
        border-color: var(--focus);
      }
      .hp {
        display: grid;
        grid-template-columns: auto 1fr auto;
        gap: 8px;
        align-items: center;
      }
      .hp .lab {
        display: inline-flex;
        gap: 4px;
        align-items: center;
        font-size: 0.85rem;
        color: var(--muted);
      }
      .bar {
        block-size: 10px;
        border-radius: 5px;
        background: var(--surface);
        border: 1px solid var(--border);
        overflow: hidden;
      }
      .bar > span {
        display: block;
        block-size: 100%;
        background: var(--p1);
      }
      .num {
        font-variant-numeric: tabular-nums;
        font-weight: 700;
      }
      .pips {
        display: inline-flex;
        gap: 2px;
      }
      .pips i {
        inline-size: 7px;
        block-size: 5px;
        border-radius: 1px;
        border: 1px solid var(--p1);
        background: var(--surface);
      }
      .pips i.on {
        background: var(--p1);
      }
      details.more {
        border-block-start: 1px solid var(--border);
        padding-block-start: 4px;
      }
      details.more summary {
        min-block-size: 44px;
        display: flex;
        align-items: center;
        gap: 6px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.92rem;
        list-style: none;
      }
      details.more summary::before {
        content: "▸";
        display: inline-block;
        transition: none;
      }
      details.more[open] summary::before {
        content: "▾";
      }
      [dir="rtl"] details.more summary::before {
        content: "◂";
      }
      [dir="rtl"] details.more[open] summary::before {
        content: "▾";
      }
      .facts {
        margin: 0;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 3px 12px;
        font-size: 0.88rem;
      }
      .facts dt {
        color: var(--muted);
      }
      .facts dd {
        margin: 0;
      }
      .vs-table {
        inline-size: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
        margin-block-start: 6px;
      }
      .vs-table th,
      .vs-table td {
        text-align: center;
        padding: 2px;
        font-weight: 400;
      }
      .vs-table th svg {
        display: block;
        margin-inline: auto;
      }
      .hint {
        display: flex;
        gap: 6px;
        align-items: flex-start;
        font-size: 0.86rem;
        margin: 0;
      }
      .hint svg {
        flex: none;
        margin-block-start: 2px;
      }

      /* ---------- Proposal 1: tiles ---------- */
      .tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin: 0;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 6px 2px 5px;
        display: grid;
        justify-items: center;
        gap: 1px;
      }
      .tile dt {
        display: contents;
      }
      .tile dt .lbl {
        order: 3;
        font-size: 0.74rem;
        color: var(--muted);
      }
      .tile dd {
        margin: 0;
        display: contents;
      }
      .tile .v {
        font-size: 1.22rem;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .tile .v small {
        font-size: 0.7rem;
        font-weight: 600;
        color: var(--muted);
      }
      .match {
        display: grid;
        grid-template-columns: auto repeat(5, minmax(0, 1fr));
        gap: 4px;
        align-items: center;
        margin: 0;
        padding: 0;
        list-style: none;
      }
      .match .mlab {
        font-size: 0.78rem;
        color: var(--muted);
        padding-inline-end: 2px;
      }
      .match li {
        display: grid;
        justify-items: center;
        gap: 0;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 3px 0 2px;
        font-size: 0.74rem;
        font-variant-numeric: tabular-nums;
      }
      .match li.none {
        background: transparent;
        border-style: dashed;
        color: var(--muted);
      }
      .grade {
        font-size: 0.7rem;
        letter-spacing: 1px;
        line-height: 1;
      }

      /* ---------- Proposal 2: meter list ---------- */
      .p2 .head .ic {
        inline-size: 48px;
        block-size: 48px;
      }
      .status {
        font-size: 0.86rem;
        color: var(--muted);
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 2px 10px;
      }
      .status span {
        display: inline-flex;
        gap: 4px;
        align-items: center;
      }
      .meters {
        display: grid;
        grid-template-columns: 22px auto 1fr auto;
        gap: 5px 8px;
        align-items: center;
        margin: 0;
      }
      .meters dt,
      .meters dd {
        margin: 0;
        display: contents;
      }
      .meters .lab {
        font-size: 0.9rem;
      }
      .meters .seg {
        display: flex;
        gap: 2px;
      }
      .meters .seg i {
        flex: 1;
        block-size: 8px;
        border-radius: 2px;
        border: 1px solid var(--p1);
        background: var(--surface);
      }
      .meters .seg i.on {
        background: var(--p1);
      }
      .meters .val {
        text-align: end;
        font-variant-numeric: tabular-nums;
        font-weight: 700;
        font-size: 0.92rem;
        white-space: nowrap;
      }
      .meters .val small {
        font-weight: 400;
        color: var(--muted);
      }
      .goodbad {
        display: grid;
        gap: 4px;
        margin: 0;
        font-size: 0.86rem;
      }
      .goodbad div {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        align-items: center;
      }
      .goodbad dt {
        color: var(--muted);
        min-inline-size: 5.2em;
      }
      .goodbad dd {
        margin: 0;
        display: inline-flex;
        gap: 3px;
        align-items: center;
      }
    </style>
  </head>
  <body>
    <div id="page"></div>
    <script src="icons.js"></script>
    <script>
      const q = new URLSearchParams(location.search);
      const mode = q.get("mode") || "360";
      const th = TH.light;
      const P1 = th.p1,
        MUTED = th.muted;

      /* ---------- Small UI pictograms (20 px, 1.8 stroke, currentColor) ---------- */
      const ui = (d, size = 18, extra = "") =>
        `<svg width="${size}" height="${size}" viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${d}${extra}</svg>`;
      const UI = {
        health: ui(
          '<path d="M10 4v12M4 10h12"/><rect x="2" y="2" width="16" height="16" rx="4"/>',
        ),
        attack: ui(
          '<circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4"/>',
        ),
        range: ui('<path d="M2.5 10h11M10.5 6.5 14 10l-3.5 3.5M17 4.5v11"/>'),
        move: ui('<path d="M4 5l5 5-5 5M10 5l5 5-5 5"/>'),
        sight: ui(
          '<path d="M1.5 10Q10 2 18.5 10Q10 18 1.5 10Z"/><circle cx="10" cy="10" r="2.4" fill="currentColor"/>',
        ),
        armour: ui('<path d="M10 2l7 3v5c0 4-3 7-7 8-4-1-7-4-7-8V5z"/>'),
        radio: ui(
          '<path d="M10 18V8M6.6 5.2a4.5 4.5 0 0 0 0 5.6M13.4 5.2a4.5 4.5 0 0 1 0 5.6M4.2 2.8a8 8 0 0 0 0 10.4M15.8 2.8a8 8 0 0 1 0 10.4"/>',
        ),
        contact: ui(
          '<path d="M10 17V9M7 6.5a4 4 0 0 1 6 0M4.5 4a7.5 7.5 0 0 1 11 0"/>',
          15,
        ),
        hold: ui(
          '<circle cx="10" cy="7" r="3.5"/><path d="M10 10.5V18M6 18h8"/>',
          15,
        ),
        pin: ui(
          '<path d="M10 18s6-5.5 6-10a6 6 0 0 0-12 0c0 4.5 6 10 6 10z"/><circle cx="10" cy="8" r="2"/>',
          15,
        ),
        packed: ui(
          '<rect x="3" y="6" width="14" height="10" rx="1.5"/><path d="M3 9.5h14M8 6V4h4v2"/>',
          15,
        ),
        noweapon: ui(
          '<circle cx="10" cy="10" r="6"/><path d="M10 1.5v4M10 14.5v4M1.5 10h4M14.5 10h4M3 17 17 3"/>',
          16,
        ),
        info: ui(
          '<circle cx="10" cy="10" r="8"/><path d="M10 9v5M10 6v.1"/>',
          16,
        ),
        cost: ui(
          '<path d="M10 2l7 4v8l-7 4-7-4V6z"/><path d="M3 6l7 4 7-4M10 10v8"/>',
          16,
        ),
        time: ui(
          '<path d="M5 2h10M5 18h10M6 2c0 5 8 5 8 8s-8 3-8 8M14 2c0 5-8 5-8 8"/>',
          16,
        ),
        rate: ui(
          '<path d="M3 6h3M3 10h6M3 14h3"/><circle cx="13.5" cy="10" r="4.5"/>',
          16,
        ),
      };
      /* Armour-class pictograms reuse the Set B silhouettes (one vocabulary for map and card). */
      const ARM = {
        infantry: "rifles",
        light: "outrider",
        heavy: "warden",
        structure: "command-post",
        air: "kite",
      };
      const armIcon = (cls, size = 22, colour = "currentColor") =>
        `<svg width="${size}" height="${size}" viewBox="8 4 28 28" aria-hidden="true" focusable="false">${SETS.B.mark(ARM[cls], colour, "#ffffff")}</svg>`;
      const mapIcon = (kind, setName = "A", size = 52) =>
        svg(
          size,
          terrainCell(th, "plain") + icon(setName, kind, th, { side: "own" }),
          'aria-hidden="true" class="ic"',
        );
      const pips = (n, of = 5) =>
        `<span class="pips" aria-hidden="true">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
      const seg = (n, of = 5) =>
        `<span class="seg" aria-hidden="true">${Array.from({ length: of }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</span>`;
      const scale5 = (v, max) => Math.max(1, Math.ceil((v / max) * 5 - 1e-9));
      const grade = (pct) =>
        pct === 0 ? 0 : pct <= 40 ? 1 : pct < 100 ? 2 : 3;
      const gradeGlyph = (g) =>
        g === 0 ? "—" : "●".repeat(g) + "○".repeat(3 - g);

      /* ---------- Data (from the strategy-3 ruleset; roster maxima: damage 25, range 7, move 9/turn, vision 6) ---------- */
      const MAX = { damage: 25, range: 7, move: 9, vision: 6 };
      const L = {
        en: {
          dir: "ltr",
          yours: "Yours",
          more: "More",
          health: "Health",
          attack: "Attack",
          range: "Range",
          move: "Move",
          sight: "Sight",
          armour: "Armour",
          radio: "Relay",
          perTurn: "/turn",
          hits: "Hits",
          strong: "Strong vs",
          weak: "Weaker vs",
          cant: "Can’t hit",
          hold: "Hold",
          inContact: "In contact",
          packed: "Packed",
          infantry: "infantry",
          light: "light",
          heavy: "heavy",
          structure: "structure",
          air: "air",
          cost: "Cost",
          build: "Build",
          rate: "Fires",
          vs: "Effect against",
          lightVehicle: "Light vehicle",
          heavyArmour: "Heavy armour",
          supply: "Supply",
          turns: (n) => (n === 1 ? "1 turn" : `${n} turns`),
          cells: "cells",
        },
        ar: {
          dir: "rtl",
          yours: "وحداتك",
          more: "المزيد",
          health: "الصحة",
          attack: "الضرر",
          range: "المدى",
          move: "السرعة",
          sight: "الرؤية",
          armour: "الدرع",
          radio: "ترحيل",
          perTurn: "/دور",
          hits: "يصيب",
          strong: "قوي ضد",
          weak: "أضعف ضد",
          cant: "لا يصيب",
          hold: "الثبات في الموقع",
          inContact: "على اتصال",
          packed: "مطوي",
          infantry: "مشاة",
          light: "خفيفة",
          heavy: "ثقيل",
          structure: "منشأة",
          air: "جوي",
          cost: "التكلفة",
          build: "وقت البناء",
          rate: "الرمي",
          vs: "التأثير ضد",
          lightVehicle: "مركبة خفيفة",
          heavyArmour: "درع ثقيل",
          supply: "إمداد",
          turns: (n) => `${n} أدوار`,
          cells: "خانات",
        },
      };
      const WARDEN = {
        kind: "warden",
        id: 5,
        name: { en: "Warden", ar: "الحارس" },
        role: { en: "Heavy tank", ar: "دبابة ثقيلة" },
        hp: 140,
        max: 140,
        armour: "heavy",
        at: "4, 9",
        weapon: {
          damage: 18,
          range: 3,
          cooldown: 2,
          delivery: "direct",
          vs: { infantry: 70, light: 100, heavy: 100, structure: 100, air: 0 },
        },
        move: 5,
        vision: 4,
        cost: 150,
        build: 2,
      };
      const MAST = {
        kind: "mast-truck",
        id: 7,
        name: { en: "Mast Truck", ar: "شاحنة الهوائي" },
        role: { en: "Mobile relay", ar: "ترحيل متنقل" },
        hp: 60,
        max: 60,
        armour: "light",
        at: "1, 10",
        relay: 5,
        move: 6,
        vision: 4,
        cost: 70,
        build: 1,
      };

      /* ---------- Proposal 1: icon tiles ---------- */
      function tile(iconSvg, value, unit, label, fill) {
        return `<div class="tile"><dt>${iconSvg}<span class="lbl">${label}</span></dt><dd><span class="v">${value}${unit ? `<small>${unit}</small>` : ""}</span>${fill === null ? '<span style="block-size:7px"></span>' : pips(fill)}</dd></div>`;
      }
      function p1(u, lang = "en", open = false) {
        const t = L[lang];
        const w = u.weapon;
        let s = `<article class="card" dir="${t.dir}" lang="${lang}" aria-label="${u.name[lang]} ${u.id}">`;
        s += `<div class="head">${mapIcon(u.kind)}<div class="who"><p class="name">${u.name[lang]} ${u.id}</p>
    <ul class="chips"><li class="chip side">${t.yours}</li><li class="chip">${u.role[lang]}</li></ul></div></div>`;
        s += `<ul class="chips">${u.relay ? `<li class="chip warn">${UI.packed}${t.packed}</li>` : `<li class="chip">${UI.hold}${t.hold}</li>`}<li class="chip">${UI.contact}${t.inContact}</li><li class="chip">${UI.pin}<bdi>${u.at}</bdi></li></ul>`;
        s += `<div class="hp"><span class="lab">${UI.health}${t.health}</span><span class="bar" aria-hidden="true"><span style="inline-size:${(u.hp / u.max) * 100}%"></span></span><span class="num">${u.hp} / ${u.max}</span></div>`;
        s += `<dl class="tiles">`;
        if (w) {
          s += tile(
            UI.attack,
            w.damage,
            "",
            t.attack,
            scale5(w.damage, MAX.damage),
          );
          s += tile(UI.range, w.range, "", t.range, scale5(w.range, MAX.range));
        } else {
          s += tile(UI.radio, u.relay, "", t.radio, scale5(u.relay, 6));
          s += tile(
            UI.armour,
            `<span style="font-size:.95rem">${t.light}</span>`,
            "",
            t.armour,
            null,
          );
        }
        s += tile(UI.move, u.move, t.perTurn, t.move, scale5(u.move, MAX.move));
        s += tile(
          UI.sight,
          u.vision,
          "",
          t.sight,
          scale5(u.vision, MAX.vision),
        );
        s += `</dl>`;
        if (w) {
          s += `<ul class="match" aria-label="${t.hits}"><span class="mlab" aria-hidden="true">${t.hits}</span>`;
          for (const cls of Object.keys(w.vs)) {
            const g = grade(w.vs[cls]);
            s += `<li class="${g === 0 ? "none" : ""}" title="${t[cls]} ${w.vs[cls]} %">${armIcon(cls, 22, g === 0 ? MUTED : "currentColor")}<span class="grade" aria-hidden="true">${gradeGlyph(g)}</span><span><span class="sr" style="position:absolute;inline-size:1px;block-size:1px;overflow:hidden;clip:rect(0 0 0 0)">${t[cls]} </span>${w.vs[cls]}%</span></li>`;
          }
          s += `</ul>`;
        } else {
          s += `<p class="hint">${UI.noweapon}<span>No weapon. Set up (1 turn in place) to extend your coverage 5 cells; it cannot move while set up.</span></p>`;
        }
        s += `<details class="more"${open ? " open" : ""}><summary>${t.more}</summary><dl class="facts">`;
        s += `<dt>${t.armour}</dt><dd>${u.armour === "heavy" ? t.heavyArmour : t.lightVehicle}</dd>`;
        if (w) s += `<dt>${t.rate}</dt><dd>every 2 ticks · direct fire</dd>`;
        else s += `<dt>Radio</dt><dd>relay, radius 5 · only while set up</dd>`;
        s += `<dt>${t.cost}</dt><dd>${u.cost} ${t.supply} · ${t.build} ${t.turns(u.build)}</dd></dl></details>`;
        return s + `</article>`;
      }

      /* ---------- Proposal 2: meter list ---------- */
      function meter(iconSvg, label, n, value, of = 5) {
        return `<div style="display:contents"><dt>${iconSvg}<span class="lab">${label}</span></dt><dd>${n === null ? "<span></span>" : seg(n, of)}<span class="val">${value}</span></dd></div>`;
      }
      function p2(u, open = false) {
        const w = u.weapon;
        const hpPips = Math.ceil((u.hp / u.max) * 5 - 1e-9);
        let s = `<article class="card p2" aria-label="${u.name.en} ${u.id}">`;
        s += `<div class="head">${svg(48, terrainCell(th, "plain") + icon("A", u.kind, th, { side: "own" }), 'aria-hidden="true" class="ic"')}<div class="who"><p class="name">${u.name.en} ${u.id}</p>
    <p class="status"><span><b style="color:${P1}">Yours</b></span><span>${u.role.en}</span></p>
    <p class="status">${u.relay ? `<span>${UI.packed}Packed</span>` : `<span>${UI.hold}Hold</span>`}<span>${UI.contact}In contact</span><span>${UI.pin}<bdi>${u.at}</bdi></span></p></div></div>`;
        s += `<dl class="meters">`;
        s += meter(
          UI.health,
          "Health",
          hpPips,
          `${u.hp}<small> / ${u.max}</small>`,
        );
        if (w) {
          s += meter(
            UI.attack,
            "Attack",
            scale5(w.damage, MAX.damage),
            `${w.damage}`,
          );
          s += meter(
            UI.range,
            "Range",
            scale5(w.range, MAX.range),
            `${w.range}<small> cells</small>`,
          );
        } else {
          s += meter(
            UI.radio,
            "Relay",
            scale5(u.relay, 6),
            `${u.relay}<small> cells</small>`,
          );
        }
        s += meter(
          UI.move,
          "Move",
          scale5(u.move, MAX.move),
          `${u.move}<small> /turn</small>`,
        );
        s += meter(
          UI.sight,
          "Sight",
          scale5(u.vision, MAX.vision),
          `${u.vision}<small> cells</small>`,
        );
        s += `</dl>`;
        if (w) {
          const by = (f) => Object.keys(w.vs).filter((c) => f(w.vs[c]));
          const item = (c) =>
            `<dd>${armIcon(c, 20, w.vs[c] === 0 ? MUTED : "currentColor")}${L.en[c]} <small style="color:${MUTED}">${w.vs[c]}%</small></dd>`;
          s += `<dl class="goodbad"><div><dt>Strong vs</dt>${by((v) => v >= 100)
            .map(item)
            .join("")}</div><div><dt>Weaker vs</dt>${by((v) => v > 0 && v < 100)
            .map(item)
            .join("")}</div><div><dt>Can’t hit</dt>${by((v) => v === 0)
            .map(item)
            .join("")}</div></dl>`;
        } else {
          s += `<p class="hint">${UI.info}<span><b>Unarmed relay.</b> Works only when set up (1 turn, then it stays put).</span></p>`;
        }
        s += `<details class="more"${open ? " open" : ""}><summary>More</summary>`;
        if (w) {
          s += `<dl class="facts"><dt>Armour</dt><dd>Heavy armour</dd><dt>Fires</dt><dd>every 2 ticks · direct fire</dd><dt>Cost</dt><dd>150 Supply · build 2 turns</dd></dl>`;
          s += `<table class="vs-table"><caption style="text-align:start;color:${MUTED};font-size:.8rem">Effect against</caption><tr>${Object.keys(
            w.vs,
          )
            .map(
              (c) =>
                `<th scope="col">${armIcon(c, 20)}<span>${L.en[c]}</span></th>`,
            )
            .join("")}</tr><tr>${Object.values(w.vs)
            .map((v) => `<td class="num">${v}%</td>`)
            .join("")}</tr></table>`;
        } else {
          s += `<dl class="facts"><dt>Armour</dt><dd>Light vehicle</dd><dt>Radio</dt><dd>relay, radius 5 · only while set up</dd><dt>Cost</dt><dd>70 Supply · build 1 turn</dd></dl>`;
        }
        return s + `</details></article>`;
      }

      /* ---------- Pages ---------- */
      const col = (title, why, inner, width) =>
        `<section class="col" style="inline-size:${width}px"><h2>${title}</h2><p class="why">${why}</p>${inner}</section>`;
      const cur = (slug, w, imgW) =>
        `<img src="../work/current-card-${slug}-${w}.png" alt="" style="inline-size:${imgW}px">`;
      const WHY = {
        cur: 'Real view (built from view.ts). Prose line repeats the card; 8–14 rows of label · bar · words; bars not aligned; "1 turns".',
        p1: "Icon tiles: four big numbers with 5-pip meters, a one-row match-up strip (armour pictograms + ●●○ grade + %), status as chips. Details behind More.",
        p2: "Meter list: one row per stat (icon · word · 5 segments · exact value), plain-word strengths / weaknesses with pictograms. Details behind More.",
        rtl: 'Proposal 1 with dir="rtl" (Arabic strings from messages.ts where they exist): tiles, chips and bars mirror via logical properties.',
      };
      let html = "";
      if (mode === "360") {
        // Phone: 360 px viewport, 16 px gutters -> 328 px content.
        for (const [u, slug] of [
          [WARDEN, "warden"],
          [MAST, "mast-truck"],
        ]) {
          html += `<div class="rowtitle">${u.name.en} — phone width (360 px viewport, 328 px content)</div><div class="row">`;
          html += col("Current", WHY.cur, cur(slug, 360, 328), 360);
          html += col("Proposal 1 · tiles", WHY.p1, p1(u), 360);
          html += col("Proposal 2 · meter list", WHY.p2, p2(u), 360);
          html += col("Proposal 1 · RTL check", WHY.rtl, p1(u, "ar"), 360);
          html += `</div>`;
        }
      } else {
        // Desktop: the side panel next to the map (~360–420 px wide); "More" opened to show the full detail.
        for (const [u, slug, open] of [
          [WARDEN, "warden", true],
          [MAST, "mast-truck", true],
        ]) {
          html += `<div class="rowtitle">${u.name.en} — desktop side panel (420 px), “More” opened</div><div class="row">`;
          html += col("Current", WHY.cur, cur(slug, 1280, 388), 420);
          html += col("Proposal 1 · tiles", WHY.p1, p1(u, "en", open), 420);
          html += col("Proposal 2 · meter list", WHY.p2, p2(u, open), 420);
          html += `</div>`;
        }
      }
      document.getElementById("page").innerHTML = html;
    </script>
  </body>
</html>
